version: "3.9"

# Stack de desarrollo local para svc-privada.
# Puertos distintos de svc-vivienda (5432 / 8001) para poder correr ambos a la vez.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db_privada
      POSTGRES_USER: user_privada
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_privada:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_privada -d db_privada"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8080"
    environment:
      DATABASE_URL: "postgresql+asyncpg://user_privada:devpassword@db:5432/db_privada"
      GCP_PROJECT_ID: "gestorcooperativo"
      SERVICE_NAME: "svc-privada"
      ENVIRONMENT: "development"
      # En dev no hay endpoint interno de portal; auth degrada a invitado.
      SVC_VIVIENDA_INTERNAL_URL: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data_privada:

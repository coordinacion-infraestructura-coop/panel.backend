[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-privada"
version = "0.1.0"
description = "Servicio de la Secretaría Privada del Ministro — gestión de demandas/gestiones (migrado desde BigQuery)"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "google-auth==2.35.0",
    "google-cloud-secret-manager==2.21.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
]
# Sólo para el ETL one-shot BigQuery -> PostgreSQL (Fase 4). No va en la imagen de runtime.
etl = [
    "google-cloud-bigquery==3.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy async corre el código sync dentro de un greenlet; sin esto coverage
# no ve las líneas ejecutadas dentro de los services y reporta falsos negativos.
concurrency = ["greenlet"]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svc-datos-externos"
version = "0.1.0"
description = "Datos de referencia externos (Censo 2022 INDEC, transferencias automáticas a municipios/comunas) — federa en resumen_territorial de svc-vivienda. Ver docs/files/spec-resumen-territorial-tablero-v2.md (ADR-025)."
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "google-auth==2.35.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "pdfplumber==0.11.4",
    "openpyxl==3.1.5",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

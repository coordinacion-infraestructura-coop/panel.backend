# =============================================================================
# GestorCooperativo — Pipeline CI/CD con Cloud Build
# Repositorio: panel.backend (raíz = /services)
# Uso: gcloud builds submit --config=cloudbuild.yaml \
#        --substitutions=_SERVICE=svc-vivienda
# =============================================================================

substitutions:
  _SERVICE: "svc-vivienda"
  _REGION: "southamerica-east1"
  _PROJECT: "gestorcooperativo"
  _REGISTRY: "southamerica-east1-docker.pkg.dev"
  # Específico de svc-vivienda (sync checklist técnico Cordón Cuneta). Inofensivo
  # como env var no usada si este mismo archivo se reutiliza para otro _SERVICE.
  _GOOGLE_SHEET_CC_ID: "1U8-Rck1fgQHpQptC4hcqhTNzPxsIBixljBt3DB3Dn9U"
  # Específico de svc-privada (ADR-015: lookup de portal_usuarios vía endpoint interno
  # de svc-vivienda). Default con la URL real -> si CI redeploya svc-privada, no le
  # borra la config de auth (`--set-env-vars` reemplaza todo). Inofensivo para svc-vivienda.
  _SVC_VIVIENDA_INTERNAL_URL: "https://svc-vivienda-iwni7vc2qq-rj.a.run.app"
  # Específico de svc-vivienda (ADR-016 / E5a: federación server-side de Privada en
  # resumen_territorial). E5a EN PRODUCCIÓN desde 2026-09-02 -> defaults encendidos, para
  # que cada redeploy de CI conserve la config (`--set-env-vars` reemplaza todo el set).
  # Rollback: pasar --substitutions=...,_PRIVADA_FETCH_ENABLED=false o `gcloud run services
  # update` con --update-env-vars. Inofensivo para otros _SERVICE (env var no leída).
  _PRIVADA_FETCH_ENABLED: "true"
  _SVC_PRIVADA_INTERNAL_URL: "https://svc-privada-iwni7vc2qq-rj.a.run.app"
  # Específico de svc-vivienda (ADR-020: vinculación de casos DGV con gestiones de
  # Privada). Confirmado 2026-09-14 contra docs/data/cat_ministerio_agencia.json
  # (MIN_GOBIERNO existe y está activo) -> encendido por default, mismo criterio que
  # _PRIVADA_FETCH_ENABLED. Rollback: --substitutions=...,_PRIVADA_SYNC_GESTIONES_ENABLED=false
  # o `gcloud run services update` con --update-env-vars. Inofensivo para otros _SERVICE.
  _PRIVADA_SYNC_GESTIONES_ENABLED: "true"
  # Específico de svc-gasifera (spec-sync-gasifera-pit.md, Fase 0 — sync de solo
  # lectura del Sheet "SEC. GAS PIT"). Mismo criterio que _GOOGLE_SHEET_CC_ID:
  # default con el ID real para que cada redeploy de CI conserve la config.
  # Inofensivo para otros _SERVICE (env var no leída por ellos).
  _GOOGLE_SHEET_GAS_PIT_ID: "11kAlP1mCPmF-Fws7lkMDnXfhoRXieq0SpKH_CQ0BRnc"
  # Específico de svc-vivienda (ADR-021: federación server-side de Gasífera en
  # resumen_territorial, mismo patrón que ADR-016/_PRIVADA_FETCH_ENABLED).
  # Defaults encendidos para que cada redeploy de CI conserve la config.
  # Rollback: --substitutions=...,_GASIFERA_FETCH_ENABLED=false o `gcloud run
  # services update` con --update-env-vars. Inofensivo para otros _SERVICE.
  _GASIFERA_FETCH_ENABLED: "true"
  _SVC_GASIFERA_INTERNAL_URL: "https://svc-gasifera-iwni7vc2qq-rj.a.run.app"
  # Específico de svc-vivienda (federación server-side de ATP/svc-gralgob en
  # resumen_territorial, mismo patrón que ADR-016/ADR-021).
  # Defaults encendidos para que cada redeploy de CI conserve la config.
  # Rollback: --substitutions=...,_ATP_FETCH_ENABLED=false o `gcloud run
  # services update` con --update-env-vars. Inofensivo para otros _SERVICE.
  _ATP_FETCH_ENABLED: "true"
  _SVC_GRALGOB_INTERNAL_URL: "https://svc-gralgob-iwni7vc2qq-rj.a.run.app"
  # Específico de svc-gralgob/svc-gasifera (ADR-023: notificación a svc-vivienda
  # cuando el sync detecta una fila NUEVA). Misma env var en ambos servicios
  # (SVC_VIVIENDA_INTERNAL_URL, ya seteada arriba para ADR-015, sirve también de
  # target). Defaults encendidos, mismo criterio que el resto de estos flags.
  # Rollback: --substitutions=...,_NOTIFICAR_FILA_NUEVA_ENABLED=false o `gcloud
  # run services update` con --update-env-vars. Inofensivo para otros _SERVICE.
  _NOTIFICAR_FILA_NUEVA_ENABLED: "true"
  # Específico de svc-gasifera/svc-gralgob (ADR-024: resolución de localidades
  # contra el padrón de svc-vivienda en sync-time). Misma URL que ADR-015/023
  # (SVC_VIVIENDA_INTERNAL_URL, ya seteada arriba) sirve también de target.
  # Defaults encendidos, mismo criterio que el resto de estos flags. Rollback:
  # --substitutions=...,_RESOLVER_LOCALIDADES_ENABLED=false o `gcloud run
  # services update` con --update-env-vars. Inofensivo para otros _SERVICE.
  _RESOLVER_LOCALIDADES_ENABLED: "true"
  # Específico de svc-gralgob (sync de solo lectura del Sheet "ATP - Compromiso
  # Gobernador"). Faltaba en este archivo desde que se creó svc-gralgob —
  # cada redeploy de CI por este pipeline borraba GOOGLE_SHEET_ATP_ID
  # (`--set-env-vars` reemplaza todo el set), dejando el sync roto en
  # silencio desde 2026-09-24 (spreadsheet_id vacío -> 404 de Sheets API).
  # Encontrado 2026-09-28 investigando por qué resumen_territorial mostraba
  # de más departamentos/localidades (ATP nunca resolvía id_geo porque no
  # sincronizaba). Mismo criterio que _GOOGLE_SHEET_CC_ID/_GAS_PIT_ID.
  _GOOGLE_SHEET_ATP_ID: "1x3E73hlGwDPBiLc9fbQuWxWUxjaibs3glModHsxCMZM"
  # svc-gralgob — ATP Interno de Gobierno, planilla "4. ATP 2026" (spec-atp-interno.md §3),
  # compartida (Lector) con svc-gralgob@.
  _GOOGLE_SHEET_ATP_INTERNO_ID: "1h3FzAL-X0_tgIGNgnZ_DgKd5rDo8oLg0wNxY0gisBAU"
  # svc-datos-externos — ATP Interno en el Resumen general del tablero (spec-atp-interno.md
  # §4.2), leído de svc-gralgob por _SVC_GRALGOB_INTERNAL_URL. Rollback:
  # --substitutions=...,_ATP_INTERNO_FETCH_ENABLED=false (el Resumen sale sin ATP, marcado).
  _ATP_INTERNO_FETCH_ENABLED: "true"
  # Padrón político único (ADR-027, spec-padron-politico-gobierno-privada.md §3):
  # svc-datos-externos lee el padrón de Privada (_SVC_PRIVADA_INTERNAL_URL) y svc-privada
  # adopta el combinado de svc-datos-externos (_SVC_DATOS_EXTERNOS_INTERNAL_URL). Rollback:
  # --substitutions=...,_PADRON_POLITICO_SYNC_ENABLED=false (Privada deja de escribirse).
  _PRIVADA_PADRON_FETCH_ENABLED: "true"
  _PADRON_POLITICO_SYNC_ENABLED: "true"
  # svc-datos-externos — botón "Actualizar datos" del tablero (spec-tablero-gobierno-actualizar.md):
  # dispara los jobs de Cloud Scheduler (svc-datos-externos@ tiene cloudscheduler.jobRunner).
  # Rollback: --substitutions=...,_ACTUALIZAR_TABLERO_ENABLED=false (el botón responde 503).
  _ACTUALIZAR_TABLERO_ENABLED: "true"
  # Específico de svc-vivienda (ADR-025: federación server-side de
  # svc-datos-externos — Censo 2022 + transferencias — en resumen_territorial,
  # mismo patrón que ADR-016/021/ATP). Default encendido para que cada
  # redeploy de CI conserve la config. Rollback:
  # --substitutions=...,_DATOS_EXTERNOS_FETCH_ENABLED=false o `gcloud run
  # services update` con --update-env-vars. Inofensivo para otros _SERVICE.
  _DATOS_EXTERNOS_FETCH_ENABLED: "true"
  _SVC_DATOS_EXTERNOS_INTERNAL_URL: "https://svc-datos-externos-iwni7vc2qq-rj.a.run.app"
  # Específico de svc-datos-externos (sync de solo lectura del nomenclador de
  # localidades de Gobierno y de "0. Resumen General - Vista" —
  # spec-datos-externos-fase1-nomenclador-demografia.md §5). Mismo
  # criterio que _GOOGLE_SHEET_ATP_ID: tienen que vivir acá porque
  # `--set-env-vars` reemplaza todo el set en cada redeploy. Las dos planillas
  # deben estar compartidas (Lector) con svc-datos-externos@. Rollback:
  # --substitutions=...,_GOB_LOCALIDADES_SYNC_ENABLED=false. Inofensivo para
  # otros _SERVICE.
  _GOOGLE_SHEET_GOB_NOMENCLADOR_ID: "1RlV9U86RjRZafet8TOyCchwDjlP7Gcr95s7FVuNgCXg"
  _GOOGLE_SHEET_GOB_RESUMEN_VISTA_ID: "1uGecUQ_NNU_k5R2kfuPt2IPUYMkt4tNXcB1_Rm7VXDE"
  _GOB_LOCALIDADES_SYNC_ENABLED: "true"
  # svc-datos-externos — planillas de transferencias de Gobierno (COPA, FOFINDES,
  # FODEMEP, FOMMEP, EMPLEADOS; spec-datos-externos-fase2-transferencias.md §3).
  # Compartidas (Lector) con svc-datos-externos@. Rollback:
  # --substitutions=...,_GOB_TRANSFERENCIAS_SYNC_ENABLED=false.
  _GOOGLE_SHEET_GOB_COPA_ID: "1o6d5E7b-94eyOtwKru8t7Sxgt2E2aHpHtcLR1Ubffqc"
  _GOOGLE_SHEET_GOB_FOFINDES_ID: "1VAPQXsI2HFwOAX_6CFlbXGqvkz_wixnRf96qgMBlSUE"
  _GOOGLE_SHEET_GOB_FODEMEP_ID: "1uWgVN2dGT1scHjXXCAtHXjFcAaKUwTmckeGvTKG0MXY"
  _GOOGLE_SHEET_GOB_FOMMEP_ID: "1YBBtk_1y8ySxxvJfDW8oq6f5uVMmoLTgJmJ4lRVvH-w"
  _GOOGLE_SHEET_GOB_EMPLEADOS_ID: "1TiQ4B8CjDvbOU2YCWCoWOk_sKhOWE2eI8VKi0doAKEw"
  # Fase 3 (spec-datos-externos-fase3-fondos.md §3): planillas 7, 9 y 17 de Gobierno.
  _GOOGLE_SHEET_GOB_FONDO_PERMANENTE_ID: "1fyjBoYEB1tEon6lgVrBRiunzB3SbIsYa226FlknLr1k"
  _GOOGLE_SHEET_GOB_FONDO_AMBIENTAL_ID: "18Y5mcFXHh42RxbCQLy27g1UfDr9ZMPR-g1acNMCnFUk"
  _GOOGLE_SHEET_GOB_COMUNIDADES_REGIONALES_ID: "16G04eF5xn88_rr5wr4SFNYDk_feY98k34u_4Zjp7H7M"
  # Fase 5 (spec-datos-externos-fase5-gestion-territorial.md §3): planillas 12, 2, 2.1, 1 y 6.
  _GOOGLE_SHEET_GOB_OBRAS_ID: "1-J9HDF7Km27JQ7d8gdkUVS9hXDOYbORzuyk6hYZ9pS8"
  _GOOGLE_SHEET_GOB_RECORRIDOS_ID: "1NA31sFzRNosJ0ZU0LWumdPB-5AGhd_byAMtUByF8ffI"
  _GOOGLE_SHEET_GOB_RECORRIDOS_MINISTRO_ID: "1GSkmLb8DXv2CJvyDUdGeVuf81wllkqH2nkNjVts8oTM"
  _GOOGLE_SHEET_GOB_REUNIONES_ID: "1VWNyjcHy0rnyldCI1LU50sb92nD3oWpMBZasI6oC7rQ"
  _GOOGLE_SHEET_GOB_CONVENIOS_ID: "1PgKPYtBzFWIUsNJIa_22pTm4rXDrrBfi3GoDcJWSkTs"
  # Fase 6 (spec-datos-externos-fase6-politico.md §3): planilla 18 (elecciones).
  _GOOGLE_SHEET_GOB_ELECCIONES_ID: "1n14N3Ht4v_qbp7XP9nzye0Iqzm0CZZ2X0Oy0jps6Cks"
  _GOB_TRANSFERENCIAS_SYNC_ENABLED: "true"
  # Específico de svc-vivienda (ADR-031: Mi Lugar consulta el valor fiscal
  # sugerido y el valor de referencia de mercado a IDECOR vía
  # svc-datos-externos — spec-mi-lugar-valor-fiscal-idecor.md). Reusa
  # _SVC_DATOS_EXTERNOS_INTERNAL_URL. Rollback:
  # --substitutions=...,_VALUACION_IDECOR_ENABLED=false. Inofensivo para otros
  # _SERVICE.
  _VALUACION_IDECOR_ENABLED: "true"
  # Específico de svc-datos-externos (spec-datos-externos-fuentes-oficiales.md:
  # Estadística Córdoba, RENABAP e IDECOR por gobierno local). Rollback:
  # --substitutions=...,_FUENTES_OFICIALES_SYNC_ENABLED=false. Inofensivo para
  # otros _SERVICE.
  _FUENTES_OFICIALES_SYNC_ENABLED: "true"

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Build de imagen Docker
  # ---------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "--tag=${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:${SHORT_SHA}"
      - "--tag=${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:latest"
      - "--file=${_SERVICE}/Dockerfile"
      - "${_SERVICE}"
    waitFor: ["-"]

  # ---------------------------------------------------------------------------
  # Step 2: Push al Artifact Registry
  # ---------------------------------------------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    id: "push-sha"
    args:
      - "push"
      - "${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:${SHORT_SHA}"
    waitFor: ["build"]

  - name: "gcr.io/cloud-builders/docker"
    id: "push-latest"
    args:
      - "push"
      - "${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:latest"
    waitFor: ["build"]

  # ---------------------------------------------------------------------------
  # Step 3: Deploy a Cloud Run
  # ---------------------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=${_SERVICE}@${_PROJECT}.iam.gserviceaccount.com"
      - "--set-secrets=DATABASE_URL=${_SERVICE}-db-url:latest"
      - "--set-env-vars=GCP_PROJECT_ID=${_PROJECT},SERVICE_NAME=${_SERVICE},ENVIRONMENT=production,GOOGLE_SHEET_CC_ID=${_GOOGLE_SHEET_CC_ID},SVC_VIVIENDA_INTERNAL_URL=${_SVC_VIVIENDA_INTERNAL_URL},PRIVADA_FETCH_ENABLED=${_PRIVADA_FETCH_ENABLED},SVC_PRIVADA_INTERNAL_URL=${_SVC_PRIVADA_INTERNAL_URL},PRIVADA_SYNC_GESTIONES_ENABLED=${_PRIVADA_SYNC_GESTIONES_ENABLED},GOOGLE_SHEET_GAS_PIT_ID=${_GOOGLE_SHEET_GAS_PIT_ID},GASIFERA_FETCH_ENABLED=${_GASIFERA_FETCH_ENABLED},SVC_GASIFERA_INTERNAL_URL=${_SVC_GASIFERA_INTERNAL_URL},ATP_FETCH_ENABLED=${_ATP_FETCH_ENABLED},SVC_GRALGOB_INTERNAL_URL=${_SVC_GRALGOB_INTERNAL_URL},NOTIFICAR_FILA_NUEVA_ENABLED=${_NOTIFICAR_FILA_NUEVA_ENABLED},RESOLVER_LOCALIDADES_ENABLED=${_RESOLVER_LOCALIDADES_ENABLED},GOOGLE_SHEET_ATP_ID=${_GOOGLE_SHEET_ATP_ID},GOOGLE_SHEET_ATP_INTERNO_ID=${_GOOGLE_SHEET_ATP_INTERNO_ID},ATP_INTERNO_FETCH_ENABLED=${_ATP_INTERNO_FETCH_ENABLED},PRIVADA_PADRON_FETCH_ENABLED=${_PRIVADA_PADRON_FETCH_ENABLED},PADRON_POLITICO_SYNC_ENABLED=${_PADRON_POLITICO_SYNC_ENABLED},ACTUALIZAR_TABLERO_ENABLED=${_ACTUALIZAR_TABLERO_ENABLED},DATOS_EXTERNOS_FETCH_ENABLED=${_DATOS_EXTERNOS_FETCH_ENABLED},SVC_DATOS_EXTERNOS_INTERNAL_URL=${_SVC_DATOS_EXTERNOS_INTERNAL_URL},GOOGLE_SHEET_GOB_NOMENCLADOR_ID=${_GOOGLE_SHEET_GOB_NOMENCLADOR_ID},GOOGLE_SHEET_GOB_RESUMEN_VISTA_ID=${_GOOGLE_SHEET_GOB_RESUMEN_VISTA_ID},GOB_LOCALIDADES_SYNC_ENABLED=${_GOB_LOCALIDADES_SYNC_ENABLED},GOOGLE_SHEET_GOB_COPA_ID=${_GOOGLE_SHEET_GOB_COPA_ID},GOOGLE_SHEET_GOB_FOFINDES_ID=${_GOOGLE_SHEET_GOB_FOFINDES_ID},GOOGLE_SHEET_GOB_FODEMEP_ID=${_GOOGLE_SHEET_GOB_FODEMEP_ID},GOOGLE_SHEET_GOB_FOMMEP_ID=${_GOOGLE_SHEET_GOB_FOMMEP_ID},GOOGLE_SHEET_GOB_EMPLEADOS_ID=${_GOOGLE_SHEET_GOB_EMPLEADOS_ID},GOOGLE_SHEET_GOB_FONDO_PERMANENTE_ID=${_GOOGLE_SHEET_GOB_FONDO_PERMANENTE_ID},GOOGLE_SHEET_GOB_FONDO_AMBIENTAL_ID=${_GOOGLE_SHEET_GOB_FONDO_AMBIENTAL_ID},GOOGLE_SHEET_GOB_COMUNIDADES_REGIONALES_ID=${_GOOGLE_SHEET_GOB_COMUNIDADES_REGIONALES_ID},GOOGLE_SHEET_GOB_OBRAS_ID=${_GOOGLE_SHEET_GOB_OBRAS_ID},GOOGLE_SHEET_GOB_RECORRIDOS_ID=${_GOOGLE_SHEET_GOB_RECORRIDOS_ID},GOOGLE_SHEET_GOB_RECORRIDOS_MINISTRO_ID=${_GOOGLE_SHEET_GOB_RECORRIDOS_MINISTRO_ID},GOOGLE_SHEET_GOB_REUNIONES_ID=${_GOOGLE_SHEET_GOB_REUNIONES_ID},GOOGLE_SHEET_GOB_CONVENIOS_ID=${_GOOGLE_SHEET_GOB_CONVENIOS_ID},GOOGLE_SHEET_GOB_ELECCIONES_ID=${_GOOGLE_SHEET_GOB_ELECCIONES_ID},GOB_TRANSFERENCIAS_SYNC_ENABLED=${_GOB_TRANSFERENCIAS_SYNC_ENABLED},VALUACION_IDECOR_ENABLED=${_VALUACION_IDECOR_ENABLED},FUENTES_OFICIALES_SYNC_ENABLED=${_FUENTES_OFICIALES_SYNC_ENABLED}"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--add-cloudsql-instances=${_PROJECT}:${_REGION}:ministerio-postgres"
    waitFor: ["push-sha"]

images:
  - "${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:${SHORT_SHA}"
  - "${_REGISTRY}/${_PROJECT}/ministerio-docker/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "900s"
